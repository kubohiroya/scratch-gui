name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scratch-gui
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        path: scratch-gui
        persist-credentials: false
    - name: Check out pinned editor package
      uses: actions/checkout@v4
      with:
        repository: kubohiroya/turbowarp-extension-data-editor
        ref: 9e041e5278a1ea70146a76c10732d1401955a12a
        path: turbowarp-extension-data-editor
        persist-credentials: false
    - uses: ./turbowarp-extension-data-editor/.github/actions/gui-checks
