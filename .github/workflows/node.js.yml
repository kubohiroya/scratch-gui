name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - run: npm run build
    - run: npm run test:unit
    - run: npm run test:block-editor
    - run: npm run test:extension-security
    - name: Upload public Editor
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      uses: actions/upload-pages-artifact@v3
      with:
        path: build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: editor-pages
      cancel-in-progress: false
    steps:
    - name: Deploy public Editor
      id: deployment
      uses: actions/deploy-pages@v4
