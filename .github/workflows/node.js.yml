name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scratch-gui
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        path: scratch-gui
        persist-credentials: false
    - name: Check out pinned editor package
      uses: actions/checkout@v4
      with:
        repository: kubohiroya/turbowarp-block-editor
        ref: 078c178d2987fd46e3cf90d6a61d8c234affc3bc
        path: turbowarp-block-editor
        persist-credentials: false
    - uses: ./turbowarp-block-editor/.github/actions/gui-checks
