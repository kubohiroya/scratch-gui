name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 26
        cache: npm
    - uses: pnpm/action-setup@v6
      with:
        version: 11.28.8
    - run: npm ci
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    - run: npm run build
    - run: npm run test:unit
    - run: npm run test:block-editor
    - run: npm run test:extension-security
