name: Verify published block editor

on:
  workflow_call:
    inputs:
      expected_revision:
        type: string
        required: true
      base_url:
        type: string
        default: https://kubohiroya.github.io/scratch-gui/
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Expected full GUI SHA (empty selects the active successful Pages deployment)
        type: string
      base_url:
        description: HTTPS application root ending with /
        type: string
        default: https://kubohiroya.github.io/scratch-gui/
  schedule:
    # Monday 02:17 UTC / 11:17 JST. Schedules run from the default branch.
    - cron: '17 2 * * 1'

permissions:
  contents: read
  deployments: read

concurrency:
  group: block-editor-public-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    # Keep the workflow implementation and runner checkout on the same commit.
    uses: kubohiroya/turbowarp-extension-data-editor/.github/workflows/turbowarp-public.yml@9e041e5278a1ea70146a76c10732d1401955a12a
    with:
      runner_revision: 9e041e5278a1ea70146a76c10732d1401955a12a
      expected_revision: ${{ inputs.expected_revision || '' }}
      base_url: ${{ inputs.base_url || 'https://kubohiroya.github.io/scratch-gui/' }}
