name: Publish extended editor

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    defaults:
      run:
        working-directory: scratch-gui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: scratch-gui
          persist-credentials: false
      - name: Require the current develop revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-pages-source.mjs
      - name: Check out pinned editor package
        uses: actions/checkout@v4
        with:
          repository: kubohiroya/turbowarp-extension-data-editor
          ref: 9e041e5278a1ea70146a76c10732d1401955a12a
          path: turbowarp-extension-data-editor
          persist-credentials: false
      - uses: ./turbowarp-extension-data-editor/.github/actions/gui-checks
        with:
          mode: pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: scratch-gui/build

  ci-gate:
    needs: build
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      actions: read
    uses: kubohiroya/turbowarp-extension-data-editor/.github/workflows/require-successful-ci.yml@612d36a7b9262c01406315be8cf37a85523389b5
    with:
      runner_revision: 612d36a7b9262c01406315be8cf37a85523389b5
      expected_revision: ${{ needs.build.outputs.revision }}
      workflow_file: node.js.yml
      branch: develop
      event: push

  deploy:
    needs: [build, ci-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.revision }}
          persist-credentials: false
      - name: Recheck develop immediately before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_REVISION: ${{ needs.build.outputs.revision }}
        run: node scripts/check-pages-source.mjs
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-public:
    needs: [build, deploy]
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/block-editor-public.yml
    with:
      expected_revision: ${{ needs.build.outputs.revision }}
