name: Publish extended editor

on:
  push:
    branches: [feat/site/github-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scratch-gui
    steps:
      - uses: actions/checkout@v4
        with:
          path: scratch-gui
          persist-credentials: false
      - name: Check out pinned editor package
        uses: actions/checkout@v4
        with:
          repository: kubohiroya/turbowarp-block-editor
          ref: b8ae85aa889bebecff5fd88b4f344e815cf8430b
          path: turbowarp-block-editor
          persist-credentials: false
      - uses: ./turbowarp-block-editor/.github/actions/gui-checks
        with:
          mode: pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: scratch-gui/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-public:
    needs: deploy
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/block-editor-public.yml
    with:
      expected_revision: ${{ github.sha }}
